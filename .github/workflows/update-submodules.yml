name: Update Submodules Automatically

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.SUBMODULE_UPDATE_PAT }}

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Update submodules safely
        run: |
          git submodule foreach --recursive 'git fetch origin && (git checkout main || git checkout master) && git reset --hard origin/main || git reset --hard origin/master'
          git submodule update --remote --merge

      - name: Commit and push changes
        run: |
          git add -A
          git diff --cached --quiet || (git commit -m "Auto-update submodules to latest version" && git push)